spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://database-fuseai.c1q86e0oyp0s.us-west-1.rds.amazonaws.com:3306/ai_tools?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=30000
    username: admin  # RDS 用户名，不是 root
    password: Fuseaitools0303!  # RDS 密码

    # Druid 连接池生产配置
    druid:
      # 核心连接池配置（生产环境适当调大）
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 10000

      # 连接验证配置
      validation-query: SELECT 1
      validation-query-timeout: 3000
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 600000

      # ⭐ 关键：错误重试控制
      connection-error-retry-attempts: 1
      break-after-acquire-failure: true
      time-between-connect-error-millis: 30000
      max-create-task-count: 3

      # 连接泄漏检测
      remove-abandoned: true
      remove-abandoned-timeout: 1800
      log-abandoned: true
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0

# AWS SES 配置
aws:
  ses:
    region: ap-southeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}  # 第22行改为环境变量
      secret-key: ${AWS_SECRET_ACCESS_KEY}  # 第23行改为环境变量
  s3:
    region: us-west-1
    accessKey: ${AWS_ACCESS_KEY_ID}  # 第26行改为环境变量
    secretKey: ${AWS_SECRET_ACCESS_KEY}  # 第27行改为环境变量
    bucketName: fuse-ai-s3


  # 邮件发送配置
  email:
    default-from: no-reply@fuseaitools.com
    default-reply-to: support@fuseaitools.com
    default-charset: UTF-8
    configuration-set: MyConfigSet  # 可选

    # 发送设置
    max-retries: 3
    retry-delay-ms: 1000

brevo:
  sender:
    apiKey: ${BREVO_API_KEY}
    email: no-reply@fuseaitools.com
    name: FuseAITools Service


stripe:
  api:
    secret-key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

server:
  port: 8080

feign:
  api:
    openai:
      url: https://www.towerfun.net/v1
    deepseek:
      url: https://www.towerfun.net/v1
    claude:
      url: https://www.towerfun.net/v1
    gemini:
      url: https://www.towerfun.net/v1
    elevenlabs:
      url: https://api.kie.ai
    image:
      url: https://api.kie.ai
    midjourney:
      url: https://www.towerfun.net/v1
    sora:
      url: https://api.kie.ai
    suno:
      url: https://api.kie.ai
    video:
      url: https://api.kie.ai

cache-config:
  redis:
    token:
      expireTime: 172800
    user:
      expireTime: 60
  caffeine:
    test:
      expireTime: 300
      maxSize: 10000

mybatis-plus:
  type-enums-package: com.fuse.common.core.entity.bo
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true

callback:
  url: https://api.fuseaitools.com/api/callback


# 自定义配置
app:
  # 验证码配置
  code:
    expire-minutes: 5          # 验证码有效期
    max-daily-per-email: 10     # 每个邮箱每日最多发送次数
    max-daily-per-ip: 30       # 每个IP每日最多发送次数
    max-global-daily: 1000     # 系统全局每日最多发送次数
  google:
    client-id: ${GOOGLE_CLIENT_ID}  # 第98行改为环境变量
    client-secret: ${GOOGLE_CLIENT_SECRET}  # 第99行改为环境变量
  # TraceId配置
  trace:
    enabled: true
    header-name: X-Trace-Id

# 日志配置 - 正确结构
logging:
  # 配置文件路径
  config: classpath:logback-spring.xml
  # 文件输出
  file:
    name: logs/application.log
  # 日志模式（pattern）必须放在这里，不能放在level下面
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  # 日志级别配置
  level:
    # 应用包
    com.fuse.ai.server: DEBUG
    # SQL日志
    SQL_LOGGER: DEBUG
    # MyBatis
    org.mybatis: DEBUG
    com.baomidou.mybatisplus: DEBUG
    # Spring
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
    # 数据库连接池
    com.zaxxer.hikari: INFO
    # JDBC
    java.sql: WARN
    java.sql.Connection: WARN
    java.sql.Statement: WARN
    java.sql.PreparedStatement: DEBUG
    java.sql.ResultSet: WARN