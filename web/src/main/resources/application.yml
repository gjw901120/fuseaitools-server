spring:
  profiles:
    active: ${AI_PROJECT_ENV}
  application:
    name: fuse-ai-server-web
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB          # 单个文件最大大小
  mvc:
    async:
      request-timeout: 180000      # 异步请求超时时间：3分钟（180秒）

app:
  defaultTokenAuth: false
  logDir: /logs/${spring.application.name}